schema_version: "1.0.0"

release:
  id: affirmation-content-database-foundation
  date: "2026-07-27"
  type: content_platform_migration
  summary: Move affirmation categories, text, and backgrounds from the app bundle into Supabase and the protected admin workspace.

content:
  topics: 9
  affirmations: 27
  backgrounds: 9
  publication_state: published
  source: existing_supporter_app_content

delivery:
  supporter_source: published Supabase rows
  offline_behavior: validated last-known-good cache
  bundled_editorial_fallback: none

