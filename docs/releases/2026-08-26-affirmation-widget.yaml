date: '2026-08-26'
title: Topic-aware affirmation widgets
type: feature

changes:
  - Added native iOS and Android home-screen affirmation widgets.
  - Added inline and rectangular iOS Lock Screen affirmation widgets.
  - Updated the iOS and Android app icon background to Moodie purple (#7357C7).
  - Show the latest delivered reminder affirmation while reminders are enabled.
  - Rotate an eligible affirmation every three hours while reminders are disabled.
  - Enforced the active topic selection across the in-app feed, notifications, notification taps, and widgets.
  - Made notification and widget taps open the exact affirmation displayed at the time of the tap, including after topic or catalog changes.
  - Added iOS notification-response forwarding and a persisted cold-start handoff so local-notification taps reliably reach the affirmation screen.

native_impact:
  required: true
  rationale: Adds an iOS WidgetKit extension, an App Group capability, and an Android AppWidget provider.
