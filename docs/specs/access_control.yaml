schema_version: "1.0.0"

document:
  id: ACCESS-CONTROL
  title: Moodie Access Control
  status: defined_for_current_features
  source_of_truth: true

identity_model:
  current_state: optional_end_user_identity
  authentication_required: false
  statement: Moodie users may authenticate with email and password through Supabase Auth, while the local affirmation and reminder experience remains available without authentication.
  identity_provider: Supabase Auth
  supported_methods:
    - email_password
    - email_otp
    - google_oauth
  authorization_source: Admin membership is stored only in the private Supabase database schema and cannot be changed by an app client.
  future_state: Resource-specific admin permissions and cross-device ownership will be added as their features are implemented.

current_actors:
  - id: anonymous_device_session
    kind: technical_actor
    description: A local application session before a product-level user model exists.
    is_product_user_role: false
  - id: authenticated_moodie_user
    kind: product_user
    description: An end user with an active Supabase Auth session.
    is_product_user_role: true
  - id: moodie_admin
    kind: operational_user
    description: An authenticated user whose Supabase Auth user ID has an active database-managed admin membership.
    is_product_user_role: true

application_boundaries:
  supporter_app:
    path: /
    surfaces:
      - ios
      - android
      - supporter_web
  admin_web:
    path: apps/admin
    surfaces:
      - web
    framework: react_vite_spa
    hosting_target: render_static_site
    production_domain: admin.moodie.am
    server_side_rendering: false
    independent_build: true
    independent_deployment: true
    prohibited_imports:
      - supporter_app_ui
      - supporter_app_navigation
      - supporter_app_state
      - supporter_app_theme
    shared_contracts:
      - supabase_auth_identity
      - public.is_admin()

roles:
  - id: admin
    assignment:
      source: private.admin_users
      permitted_path: direct_database_sql_only
      client_mutation_allowed: false
    evaluation:
      operation: public.is_admin()
      scope: current_authenticated_user_only
      fail_closed: true

permission_matrix:
  - actor: anonymous_device_session
    resource: local_affirmation_experience
    permissions:
      - view
      - select_topics
      - select_background
      - like
      - share
    basis: Current features are device-local and no authentication boundary is documented.
  - actor: anonymous_device_session
    resource: local_reminder_preferences
    permissions:
      - view
      - update
    basis: Current reminder configuration is device-local and no authentication boundary is documented.
  - actor: authenticated_moodie_user
    resource: local_affirmation_experience
    permissions:
      - view
      - select_topics
      - select_background
      - like
      - share
    basis: Authentication does not yet change access to device-local features.
  - actor: authenticated_moodie_user
    resource: local_reminder_preferences
    permissions:
      - view
      - update
    basis: Authentication does not yet change access to device-local features.
  - actor: authenticated_moodie_user
    resource: own_auth_session
    permissions:
      - view
      - create
      - delete
    basis: The user can sign in and sign out through the inline Settings account section.
  - actor: authenticated_moodie_user
    resource: own_admin_membership
    permissions:
      - view
    basis: The authenticated client can evaluate only whether its current session belongs to an administrator.
  - actor: moodie_admin
    resource: own_admin_membership
    permissions:
      - view
    basis: Admin membership is visible to the current account but cannot be assigned, changed, or revoked by the app.

undefined_permissions:
  - resource: product_catalog_management
    roles:
      - admin
  - resource: remote_content_publishing
    roles:
      - admin
  - resource: purchase_entitlements
    roles: TBD
  - resource: receipt_validation
    roles: TBD
  - resource: analytics_data
    roles: TBD
  - resource: release_management
    roles: TBD

security_requirements:
  - id: ACCESS-001
    priority: MUST
    statement: Authentication must use the approved Supabase email/password, email OTP, or Google OAuth flows and remain optional until a broader identity and authorization model is approved.
  - id: ACCESS-002
    priority: MUST
    statement: Store, CMS, and API contracts must document authentication and security constraints before implementation.
  - id: ACCESS-003
    priority: MUST
    statement: Receipt validation and entitlement granting must occur through a trusted backend boundary once commerce is implemented.
  - id: ACCESS-004
    priority: MUST
    statement: Admin membership must be assigned or revoked only through direct database SQL by an authorized operator.
  - id: ACCESS-005
    priority: MUST
    statement: No anonymous or authenticated client may insert, update, or delete admin memberships.
  - id: ACCESS-006
    priority: MUST
    statement: Client and policy checks for admin access must derive the current user from auth.uid() and must not accept a caller-supplied user ID.
  - id: ACCESS-007
    priority: MUST
    statement: The admin web application must fail closed when admin membership cannot be verified.
  - id: ACCESS-008
    priority: MUST
    statement: Every privileged admin data operation must be protected by database RLS or a trusted backend authorization boundary.

open_decisions:
  - id: ACCESS-TBD-002
    question: Which preferences and entitlements synchronize across devices?
    status: TBD
  - id: ACCESS-TBD-003
    question: How are Moodie accounts provisioned and recovered?
    status: TBD
