schema_version: '1.0.0'

document:
  id: DOMAIN-MODEL
  title: Moodie Canonical Domain Model
  status: partially_defined
  source_of_truth: true

conventions:
  entity_names: PascalCase
  field_names: snake_case
  identifier_type: string
  unresolved_value: TBD
  note: Types marked TBD are intentional gaps and are not implementation permission.

entities:
  - name: AffirmationTopic
    status: defined
    storage: supabase_public.affirmation_topics
    fields:
      - name: id
        type: string
        required: true
        unique: true
      - name: name
        type: string
        required: true
      - name: image_uri
        type: uri
        required: true
      - name: affirmations
        type: list<Affirmation>
        required: true
      - name: sort_order
        type: integer
        required: true
      - name: is_published
        type: boolean
        required: true
    relationships:
      - type: has_many
        target: Affirmation
        foreign_key: topic_id

  - name: Affirmation
    status: defined
    storage: supabase_public.affirmations
    fields:
      - name: id
        type: uuid
        required: true
        unique: true
      - name: topic_id
        type: string
        required: true
      - name: text
        type: string
        required: true
        constraints:
          min_length: 1
      - name: background_suggestion_uris
        type: list<uri>
        required: true
        constraints:
          min_items: 1
        implementation_field: image_uri
      - name: sort_order
        type: integer
        required: true
      - name: is_published
        type: boolean
        required: true
    relationships:
      - type: belongs_to
        target: AffirmationTopic
        foreign_key: topic_id
    notes:
      - Text has one or more weakly connected background suggestions.
      - Text is not strictly bound one-to-one to gallery backgrounds.

  - name: AffirmationBackground
    status: defined
    storage: supabase_public.affirmation_backgrounds
    fields:
      - name: id
        type: string
        required: true
        unique: true
      - name: image_uri
        type: uri
        required: true
      - name: tags
        type: list<string>
        required: true
        constraints:
          min_items: 1
          unique_items: true
      - name: sort_order
        type: integer
        required: true
      - name: is_published
        type: boolean
        required: true

  - name: AffirmationPreferences
    status: defined
    storage: supabase_public.user_settings_with_device_cache
    fields:
      - name: selected_topic_ids
        type: list<string>
        required: true
        constraints:
          unique_items: true
          empty_means: all_topics_active
      - name: background_mode
        type: enum
        required: true
        allowed_values:
          - free
          - fixed
      - name: fixed_background_id
        type: string|null
        required: true
        constraints:
          non_null_when: background_mode == fixed
      - name: liked_affirmation_ids
        type: list<string>
        required: true
        constraints:
          unique_items: true
    relationships:
      - type: references_many
        target: AffirmationTopic
        field: selected_topic_ids
      - type: references_one_optional
        target: AffirmationBackground
        field: fixed_background_id
      - type: references_many
        target: Affirmation
        field: liked_affirmation_ids
    ownership:
      anonymous_session: device_local
      authenticated_session: auth.users.id
      conflict_rule: database_wins_on_sign_in

  - name: ReminderPreferences
    status: defined
    storage: supabase_public.user_settings_with_device_cache
    fields:
      - name: enabled
        type: boolean
        required: true
      - name: hour
        type: integer
        required: true
        constraints:
          minimum: 0
          maximum: 23
      - name: minute
        type: integer
        required: true
        constraints:
          minimum: 0
          maximum: 59
      - name: timezone
        type: string
        required: TBD
    ownership:
      anonymous_session: device_local
      authenticated_session: auth.users.id
      conflict_rule: database_wins_on_sign_in
    unresolved:
      - Time-zone and daylight-saving behavior is TBD.

  - name: UserSettings
    status: defined
    storage: supabase_public.user_settings
    fields:
      - name: user_id
        type: uuid
        required: true
        unique: true
      - name: theme_preference
        type: enum
        required: true
        allowed_values:
          - system
          - light
          - dark
      - name: reminder_enabled
        type: boolean
        required: true
      - name: reminder_hour
        type: integer
        required: true
        constraints:
          minimum: 0
          maximum: 23
      - name: reminder_minute
        type: integer
        required: true
        constraints:
          minimum: 0
          maximum: 59
      - name: selected_topic_ids
        type: list<string>
        required: true
      - name: background_mode
        type: enum
        required: true
        allowed_values:
          - free
          - fixed
      - name: background_id
        type: string|null
        required: true
      - name: liked_affirmation_keys
        type: list<string>
        required: true
      - name: updated_at
        type: timestamp
        required: true
    relationships:
      - type: belongs_to
        target: SupabaseAuthUser
        foreign_key: user_id
    synchronization:
      signed_out: Persist changes to the device only.
      first_sign_in_without_database_row: Seed the database from current device settings.
      sign_in_with_database_row: Replace device state with the database row.
      authenticated_change: Persist locally, then upsert the complete database snapshot.
      offline_authenticated_change: Keep a user-scoped pending snapshot and retry before the next database pull.

  - name: ProductAnalog
    status: provisional
    storage: remote_cms_planned
    fields:
      - name: id
        type: string
        required: true
        unique: true
        description: Stable unique identifier.
      - name: sku
        type: string
        required: true
        unique: TBD
        description: Store or back-office SKU.
      - name: title
        type: string
        required: true
        description: User-facing name.
      - name: description
        type: string
        required: true
        description: Short product summary.
      - name: media
        type: list<MediaAsset>
        required: true
        description: Images, video, and 3D or AR placeholders.
      - name: availability
        type: list<ProductAvailability>
        required: true
        description: Market and platform constraints.
    notes:
      - This entity is the source for future TypeScript model generation.

  - name: MediaAsset
    status: provisional
    storage: remote_cms_planned
    fields:
      - name: id
        type: string
        required: true
        unique: true
      - name: type
        type: enum
        required: true
        allowed_values:
          - image
          - video
          - three_d_placeholder
          - ar_placeholder
      - name: uri
        type: uri
        required: true
      - name: metadata
        type: map
        required: TBD

  - name: ProductAvailability
    status: provisional
    storage: remote_cms_planned
    fields:
      - name: market
        type: string
        required: true
      - name: platform
        type: enum
        required: true
        allowed_values:
          - ios
          - android
      - name: available
        type: boolean
        required: true
      - name: constraints
        type: map
        required: TBD

  - name: StoreProductMapping
    status: TBD
    storage: TBD
    fields:
      - name: product_analog_id
        type: string
        required: true
      - name: platform
        type: enum
        required: true
        allowed_values:
          - ios
          - android
      - name: store_product_id
        type: string
        required: true
        unique: TBD
      - name: price_tier
        type: string
        required: TBD
    relationships:
      - type: belongs_to
        target: ProductAnalog
        foreign_key: product_analog_id

  - name: Purchase
    status: TBD
    storage: backend_planned
    fields:
      - name: id
        type: string
        required: true
        unique: true
      - name: store_product_id
        type: string
        required: true
      - name: platform
        type: enum
        required: true
        allowed_values:
          - ios
          - android
      - name: receipt_reference
        type: string
        required: true
        security: Must not expose raw receipt material to analytics or UI.
      - name: validation_status
        type: enum
        required: true
        allowed_values: TBD
      - name: created_at
        type: datetime
        required: true
      - name: user_id
        type: string
        required: TBD
        description: Depends on the future user model.

  - name: Entitlement
    status: TBD
    storage: backend_planned
    fields:
      - name: id
        type: string
        required: true
        unique: true
      - name: purchase_id
        type: string
        required: true
      - name: product_analog_id
        type: string
        required: true
      - name: user_id
        type: string
        required: TBD
      - name: granted_at
        type: datetime
        required: true
      - name: status
        type: enum
        required: true
        allowed_values: TBD
    relationships:
      - type: belongs_to
        target: Purchase
        foreign_key: purchase_id
      - type: belongs_to
        target: ProductAnalog
        foreign_key: product_analog_id

  - name: CommerceAuditEvent
    status: TBD
    storage: backend_planned
    fields:
      - name: id
        type: string
        required: true
        unique: true
      - name: purchase_id
        type: string
        required: true
      - name: event_type
        type: string
        required: true
      - name: occurred_at
        type: datetime
        required: true
      - name: metadata
        type: map
        required: TBD

  - name: ContentPayload
    status: provisional
    storage: supabase_planned
    fields:
      - name: version
        type: string
        required: true
        unique: true
      - name: schema_version
        type: string
        required: true
      - name: content
        type: map
        required: true
      - name: published_at
        type: datetime
        required: TBD
      - name: release_notes
        type: string
        required: TBD
    notes:
      - Supabase project vwougnsbyqqeessdkbae is the approved remote source.
      - The table, storage bucket, and payload transport design remain TBD.

  - name: AnalyticsEventDefinition
    status: provisional
    storage: specification
    fields:
      - name: name
        type: string
        required: true
        unique: true
        constraints:
          naming_pattern: domain_action_subject
      - name: trigger_point
        type: string
        required: true
      - name: required_payload_fields
        type: list<string>
        required: true
      - name: privacy_classification
        type: string
        required: true
      - name: dashboard_owner
        type: string
        required: true
