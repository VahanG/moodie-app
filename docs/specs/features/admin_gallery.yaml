schema_version: '1.3.0'

feature:
  id: FEATURE-ADMIN-GALLERY
  name: Admin Media Gallery
  lifecycle: implemented
  purpose: Give Moodie administrators a protected library for reusable image and video assets.
  surface: admin_web
  storage_bucket: gallery
  metadata_table: public.gallery_media

requirements:
  - id: GAL-001
    title: Protected Bulk Media Upload
    description: Administrators can upload one or more supported media files in one action.
    priority: MUST
    acceptance_criteria:
      - The file picker accepts multiple supported image and video files.
      - Empty, unsupported, and files larger than 50 MB are rejected before upload.
      - Partial batches and metadata failures clean up newly uploaded objects.
      - File bytes are stored in the private gallery bucket.
    verification:
      status: admin_build_and_migration_validation

  - id: GAL-002
    title: Gallery Preview and Discovery
    description: Administrators can preview and find stored media from the gallery.
    priority: MUST
    acceptance_criteria:
      - Images render as card previews.
      - Videos render as card previews and expose controls in the single-item editor.
      - Private objects are previewed through short-lived signed URLs.
      - Name, description, tags, MIME type, and file size can be searched from the loaded gallery.
      - Fileless registered assets show an Awaiting upload placeholder.
      - Search includes asset ID, provider, creator, and asset status.
    verification:
      status: admin_build_test

  - id: GAL-003
    title: Single and Bulk Metadata Editing
    description: Administrators can edit one item or apply chosen metadata fields to many selected items.
    priority: MUST
    acceptance_criteria:
      - One selected item exposes editable name, description, and tags.
      - Multiple selected items require an explicit choice for every field applied to the selection.
      - Unchecked bulk fields remain unchanged.
      - Tags are trimmed, lowercased, de-duplicated, and stored as an array.
      - A media name cannot be blank.
      - Single-item editing exposes asset ID, provider, creator, license, dimensions, download date, and asset status.
      - Asset ID is a required globally unique string.
    verification:
      status: admin_build_test

  - id: GAL-004
    title: Post-Upload Edit Mode
    description: Newly uploaded media enters metadata editing immediately.
    priority: MUST
    acceptance_criteria:
      - Every item created by the completed upload batch is selected.
      - The metadata editor opens automatically for that selection.
    verification:
      status: automated_admin_source_contract

  - id: GAL-005
    title: Gallery Authorization
    description: Gallery metadata and mutations are restricted to administrators while uploaded objects can be delivered to supporter clients.
    priority: MUST
    acceptance_criteria:
      - The gallery metadata table has RLS enabled.
      - Select, insert, update, and delete operations require public.is_admin().
      - Storage insert, update, and delete policies require public.is_admin().
      - Anonymous and authenticated supporter clients can read uploaded gallery objects through signed URLs.
      - The gallery bucket remains private and stable gallery:// references are not persisted as expiring signed URLs.
    verification:
      status: local_supabase_migration_and_schema_lint

  - id: GAL-006
    title: Guarded Permanent Removal
    description: Administrators can permanently remove unreferenced media while referenced media remains protected.
    priority: MUST
    acceptance_criteria:
      - Removal is available from the single-item metadata editor and requires confirmation.
      - The usage check covers affirmation categories, affirmations, and backgrounds whose image URI contains the gallery object path.
      - Referenced media displays the matching entity types and IDs and cannot be removed.
      - Failure to verify usage blocks removal.
      - Authenticated clients cannot delete gallery metadata directly.
      - The guarded database function repeats the usage check while locking the media record.
      - Successful removal deletes both the gallery metadata row and the private Storage object.
      - Removing a fileless asset row does not attempt a Storage deletion.
    verification:
      status: admin_build_test_and_local_supabase_migration_validation

  - id: GAL-007
    title: Asset Registration Before Upload
    description: Licensing metadata can be registered before file bytes are available.
    priority: MUST
    acceptance_criteria:
      - A gallery row can exist without object path, MIME type, file size, or uploader.
      - File metadata is either entirely absent or entirely present.
      - Each row has a required globally unique string asset ID.
      - Source metadata stores provider, creator, license name, license check date, download date, original dimensions, and status without storing provider URLs.
      - Existing uploaded rows receive stable legacy asset IDs during migration.
    verification:
      status: migration_validation_and_admin_build_test

  - id: GAL-008
    title: Attach Uploads by Asset ID
    description: Administrators can attach image files to existing fileless gallery rows by including the exact Asset ID in each filename.
    priority: MUST
    acceptance_criteria:
      - Attachment mode is separate from the existing upload-and-create mode.
      - Matching is exact and case-sensitive against an Asset ID contained in the filename.
      - Attachment mode never creates a new gallery row.
      - Empty, unsupported, oversized, unmatched, ambiguous, already-attached, and duplicate files are not persisted.
      - Rejected files and their reasons are displayed to the administrator.
      - Accepted files are attached to fileless rows in one admin-only database transaction.
      - A concurrent attachment or database failure changes no gallery rows and removes all objects uploaded by the failed attempt.
      - A Storage failure removes every object uploaded by the failed attempt and changes no gallery rows.
      - Successful attachment records object path, MIME type, file size, uploader, download date when absent, and pending-review status.
    verification:
      status: matching_unit_tests_admin_build_and_migration_validation

  - id: GAL-009
    title: Admin-Side JPEG Optimization
    description: JPEGs are resized and converted before Storage upload so supporter clients receive compact mobile-ready assets.
    priority: MUST
    acceptance_criteria:
      - Optimization runs only in the standalone admin web application and requires no supporter-app processing.
      - JPEG width is limited to 1440 pixels without upscaling and aspect ratio is preserved.
      - JPEGs are encoded as WebP at 80 percent quality and only the WebP result is uploaded.
      - Both create-new and attach-by-Asset-ID upload modes use the same optimization behavior.
      - Asset-ID matching uses the original selected filename before conversion.
      - The stored object path, MIME type, and size describe the optimized WebP file.
      - Original JPEG dimensions are retained as gallery metadata for create-new uploads.
      - No thumbnail variant is created or stored.
      - A decode or encode failure stops the attempt before any Storage upload begins.
    verification:
      status: image_optimization_unit_tests_admin_build_and_lint
