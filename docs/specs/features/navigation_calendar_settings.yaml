schema_version: '1.0.0'

feature:
  id: FEATURE-NAVIGATION-CALENDAR-SETTINGS
  name: Home Navigation, Calendar, and Settings
  lifecycle: current
  purpose: Preserve Calendar for a future return while temporarily exposing only Affirmations and Settings.
  entry_route: moodie://affirmations

requirements:
  - id: NAV-001
    title: Two-Page Home Navigation
    description: The home experience temporarily provides horizontal navigation between Affirmations and Settings.
    priority: MUST
    acceptance_criteria:
      - Exactly two primary pages are visible in this order: Affirmations, Settings.
      - Affirmations is the default landing page.
      - Horizontal swiping does not move between pages.
      - A persistent bottom navigation exposes Today (Affirmations) and Settings with an icon and text label.
      - Calendar has no bottom-navigation item and cannot be reached by swiping.
      - Tapping Settings scrolls directly to Settings.
      - Tapping the bottom-left control returns to Affirmations and opens Topic Selection.
      - A top-left close control on Settings returns to Affirmations without opening Topic Selection.
      - Programmatic pager movement updates the active navigation item and remains synchronized when scrolling settles.
      - Direct tab selection keeps the pager and active navigation item on the same page.
      - The active navigation item has a visible selected treatment.
      - Every navigation item exposes a tab role, selected state, accessible label, and minimum 44-point touch target.
    verification:
      test_id: navigate_visible_home_pages
      steps:
        - action: goto
          url: moodie://launch
        - action: expect_visible
          selector: "[data-testid='screen-affirmations']"
        - action: click
          selector: "[data-testid='gesture-home-next']"
        - action: expect_visible
          selector: "[data-testid='screen-affirmations']"
        - action: expect_not_visible
          selector: "[data-testid='screen-calendar']"
        - action: expect_not_visible
          selector: "[data-testid='btn-nav-calendar']"
        - action: click
          selector: "[data-testid='btn-nav-settings']"
        - action: expect_visible
          selector: "[data-testid='screen-settings']"
        - action: click
          selector: "[data-testid='btn-nav-affirmations']"
        - action: expect_visible
          selector: "[data-testid='modal-topic-selection']"
        - action: click
          selector: "[data-testid='btn-close-topic-selection']"
        - action: expect_visible
          selector: "[data-testid='screen-affirmations']"
      notes:
        - Horizontal swipe adapter controls must leave the selected page unchanged.

  - id: CAL-001
    title: Daily Calendar Presentation
    description: Calendar remains implemented for a future return but is temporarily hidden from the home experience.
    priority: MUST
    acceptance_criteria:
      - The Calendar component and its tests remain in the codebase.
      - The Calendar page is not mounted in the home pager while its visibility flag is disabled.
      - The Calendar navigation control is not rendered while its visibility flag is disabled.
      - Re-enabling Calendar restores it between Affirmations and Settings.
      - A Calendar heading and supporting description establish the page hierarchy.
      - The current local weekday, day, month, and year are readable within a large rounded media card.
      - The media-card background comes from the remotely delivered affirmation background catalog; no bundled or hardcoded image URL is used as an editorial fallback.
      - When remote or last-known-good cached backgrounds are unavailable, the calendar remains usable without rendering a background image.
      - A protective image overlay keeps the date and daily message readable over the background.
      - The daily message remains visible and is visually separated from the date.
      - The layout uses themed outer spacing and adapts typography and padding for compact mobile heights.
      - No scheduling, event creation, or date-navigation behavior is implied.
    verification:
      test_id: calendar_page_remains_dormant
      steps:
        - action: goto
          url: moodie://launch
        - action: expect_not_visible
          selector: "[data-testid='screen-calendar']"
        - action: expect_not_visible
          selector: "[data-testid='btn-nav-calendar']"

  - id: SET-001
    title: Structured Settings Page
    description: Settings organizes device appearance, notifications, and account controls into a clear mobile-first hierarchy.
    priority: MUST
    acceptance_criteria:
      - The Settings page remains reachable from the home pager.
      - A Settings heading and supporting description establish the page hierarchy.
      - A top-left close control exits Settings and returns to Affirmations.
      - Appearance, Notifications, and Account are presented as distinct themed cards in that order.
      - Each settings card uses an icon, title, and short description to communicate its purpose.
      - Settings content uses responsive outer spacing and a readable maximum width on larger viewports.
      - Reminder behavior follows docs/specs/features/reminders.yaml.
      - Appearance and Account behavior remain unchanged.
    verification:
      test_id: settings_page_remains_available
      steps:
        - action: goto
          url: moodie://settings
        - action: expect_visible
          selector: "[data-testid='screen-settings']"
        - action: expect_visible
          selector: "[data-testid='section-appearance']"
        - action: expect_visible
          selector: "[data-testid='section-notifications']"
        - action: expect_visible
          selector: "[data-testid='section-account']"

open_decisions:
  - id: NAV-TBD-001
    question: Should a future Calendar release add date navigation, saved reflections, or scheduled content?
    status: TBD
  - id: NAV-TBD-002
    question: Which additional Settings capabilities should be introduced beyond appearance, reminders, and account?
    status: TBD
