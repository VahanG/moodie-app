schema_version: "1.0.0"

feature:
  id: FEATURE-AUTHENTICATION
  name: Inline User Authentication
  lifecycle: current
  purpose: Let existing Moodie users manage an optional Supabase session from Settings without adding a primary page, route, or application root.
  placement:
    parent: SettingsPanel
    constraint: Authentication is an inline section of the existing Settings page.
  methods:
    - email_password
    - email_otp
    - google_oauth
    - apple_native_ios

requirements:
  - id: AUTH-001
    title: Inline Email and Password Sign-In
    description: A signed-out user can enter an email address and password in Settings and create a Supabase Auth session.
    priority: MUST
    acceptance_criteria:
      - The account controls are rendered inside SettingsPanel.
      - No authentication screen, home-pager page, navigation route, or alternate application root is introduced.
      - Email and password are required before a request is submitted.
      - The password is obscured while entered.
      - A failed request leaves the user signed out and shows an actionable inline error.
      - Authentication is unavailable with an explanatory inline state when Supabase client configuration is absent.
    verification:
      test_id: sign_in_from_settings
      steps:
        - action: goto
          url: moodie://settings
        - action: expect_visible
          selector: "[data-testid='section-account']"
        - action: type
          selector: "[data-testid='input-auth-email']"
          value: existing-user@example.com
        - action: type
          selector: "[data-testid='input-auth-password']"
          value: valid-password
        - action: click
          selector: "[data-testid='btn-sign-in']"
        - action: expect_visible
          selector: "[data-testid='btn-sign-out']"

  - id: AUTH-002
    title: Persistent Session State and Sign-Out
    description: The inline section reflects the persisted Supabase session and lets the current user sign out.
    priority: MUST
    acceptance_criteria:
      - Session state is read when the account section mounts.
      - Supabase auth-state changes update the section without app navigation.
      - A signed-in state identifies the current account by email when available.
      - Sign-out clears the Supabase session and restores the inline sign-in form.
      - Signing in is not required to use existing device-local features.

  - id: AUTH-003
    title: Email One-Time Password
    description: An existing user can request and verify a six-digit email code from the inline account section.
    priority: MUST
    acceptance_criteria:
      - Requesting a code uses Supabase signInWithOtp with shouldCreateUser set to false.
      - A six-digit numeric code is verified with the email verification type.
      - Sending, verification, cancellation, and error states remain inline in Settings.
      - The user can switch between password and OTP modes without navigation.

  - id: AUTH-004
    title: Google OAuth
    description: A user can authenticate with Google through Supabase OAuth and return to the inline account section.
    priority: MUST
    acceptance_criteria:
      - Google authentication opens a system browser session.
      - The OAuth request redirects to moodie-app://auth/callback on native builds.
      - A successful callback creates and persists the Supabase session.
      - Canceling or failing the browser flow leaves the user signed out and shows inline status.
      - No Google client secret is bundled in the application.

  - id: AUTH-005
    title: Database-Controlled Admin Status
    description: A signed-in user can see when the current account has been assigned the admin role directly in Supabase.
    priority: MUST
    acceptance_criteria:
      - Admin status is resolved from the current authenticated user ID through a database function.
      - The client cannot provide a user ID to the admin-status operation.
      - A failed or missing admin lookup never grants admin access.
      - The Settings account section identifies an administrator after the database check succeeds.
      - No role-assignment, role-update, or role-revocation control exists in the app.

  - id: AUTH-006
    title: Native Sign in with Apple on iOS
    description: An iOS user can create a Supabase session with Apple's native authentication sheet from the inline account section.
    priority: MUST
    acceptance_criteria:
      - The Apple option is rendered only when native Apple authentication is available on the current iOS device.
      - The control uses Apple's system-provided Sign in with Apple button.
      - The native request asks for the user's email and exchanges the returned Apple identity token through Supabase signInWithIdToken.
      - A successful exchange creates and persists the Supabase session without browser navigation.
      - Canceling or failing the native flow leaves the user signed out and shows inline status.
      - Android and web builds do not render an Apple sign-in option.

supabase_dashboard_setup:
  email:
    - Enable the Email provider under Authentication providers.
    - Change the Magic Link email template to include the {{ .Token }} variable so signInWithOtp sends a six-digit code instead of a magic link.
    - Configure production SMTP before release.
  google:
    - Create a Web application OAuth client in Google Auth Platform.
    - Add https://vwougnsbyqqeessdkbae.supabase.co/auth/v1/callback as an authorized Google redirect URI.
    - Enable Google in Supabase Authentication providers and store the Google client ID and client secret there.
  apple:
    - Enable Sign in with Apple for the com.moodie.am App ID in the Apple Developer portal.
    - Enable Apple in Supabase Authentication providers and register com.moodie.am in the Client IDs list.
    - Native-only Apple authentication does not require a Services ID, OAuth secret, or redirect URL.
  redirects:
    - Add moodie-app://auth/callback to the Supabase Authentication URL Configuration redirect allow list.
    - Add http://localhost:5173 for local admin development.
    - Add https://admin.moodie.am for the production admin application.
    - Keep production redirect entries exact; do not use a production-domain wildcard.

out_of_scope:
  - Account registration.
  - Password recovery.
  - Social authentication providers other than Google and native Apple authentication on iOS.
  - Admin management UI.
  - Protected admin application pages until an administrative feature is specified.

open_decisions:
  - id: AUTH-TBD-001
    question: How will users receive or create their initial Moodie account?
    status: TBD
  - id: AUTH-TBD-002
    question: Which password recovery flow will be supported?
    status: TBD
