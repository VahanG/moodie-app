schema_version: '1.0.0'

document:
  id: SUPABASE-INTEGRATION
  title: Moodie Supabase Integration
  status: connected
  source_of_truth: true

project:
  ref: vwougnsbyqqeessdkbae
  url: https://vwougnsbyqqeessdkbae.supabase.co
  provider: Supabase Cloud
  cli_link_status: linked
  local_stack_status: unavailable_until_docker_is_running
  hosted_connectivity:
    status: verified
    verified_at: '2026-07-26'
    endpoint: /auth/v1/settings
  hosted_auth:
    email_provider: enabled
    google_provider: enabled
    native_google_oauth_start: verified
    native_redirect: moodie-app://auth/callback

client:
  platform: Expo React Native with web support
  package: '@supabase/supabase-js'
  module: src/features/supabase/client.ts
  url_polyfill: react-native-url-polyfill/auto
  native_session_storage: '@react-native-async-storage/async-storage'
  web_session_storage: supabase_js_default_web_storage
  auth_options:
    auto_refresh_token: true
    persist_session: true
    detect_session_in_url: false
    lock: processLock
  auth_methods:
    - email_password
    - email_otp
    - google_oauth
  native_oauth_redirect: moodie-app://auth/callback
  app_state_behavior:
    native_foreground: start token auto-refresh
    native_background: stop token auto-refresh
    web: use Supabase browser lifecycle
  admin_web:
    module: apps/admin/src/lib/supabase.ts
    framework: React and Vite SPA
    session_storage: supabase_js_default_web_storage
    oauth_flow: pkce
    oauth_callback:
      local: http://localhost:5173
      production: https://admin.moodie.am
    local_environment_source: repository-root .env
    production_environment_source: Render build environment

environment:
  local_file: .env
  committed_template: .env.example
  eas_project: '@vahan.vgs/moodie-app'
  eas_environments:
    development: configured
    preview: configured
    production: configured
  variables:
    - name: EXPO_PUBLIC_SUPABASE_URL
      required: true
      classification: public_project_identifier
      expected_value: https://vwougnsbyqqeessdkbae.supabase.co
    - name: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
      required: true
      classification: public_client_key
      expected_value: project_connect_panel_publishable_key
  forbidden_client_variables:
    - SUPABASE_SERVICE_ROLE_KEY
    - SUPABASE_SECRET_KEY
    - database_password
    - SUPABASE_ACCESS_TOKEN

security:
  - id: SUP-SEC-001
    priority: MUST
    statement: Never ship service-role, secret, database-password, or management-access credentials in the client bundle.
  - id: SUP-SEC-002
    priority: MUST
    statement: Enable Row Level Security on every application table exposed through the Data API.
  - id: SUP-SEC-003
    priority: MUST
    statement: Grant only operations required by explicit anon or authenticated policies.
  - id: SUP-SEC-004
    priority: MUST
    statement: Limit the current client auth surface to the optional email/password session behavior defined in docs/specs/features/authentication.yaml.
  - id: SUP-SEC-005
    priority: MUST
    statement: Store admin memberships in a private schema that is not exposed by the Data API.
  - id: SUP-SEC-006
    priority: MUST
    statement: Expose only a current-session is_admin check to authenticated clients; do not expose admin membership mutations or caller-selected identity checks.

connection_acceptance_criteria:
  - The project URL is validated before client construction.
  - Missing or malformed client configuration produces an actionable error without exposing credentials.
  - Native auth sessions persist in AsyncStorage.
  - Native token refresh follows application foreground and background state.
  - Web uses the Supabase client browser storage behavior.
  - The admin Vite app can reuse the repository-root public Supabase values locally without copying credentials.
  - Admin Google OAuth returns through its exact application origin and restores a persisted browser session.
  - Unit tests do not require live credentials.
  - A hosted connectivity check succeeds after the publishable key is configured.

database_workflow:
  config_path: supabase/config.toml
  migrations_path: supabase/migrations
  rules:
    - Commit config.toml and migrations.
    - Do not commit supabase/.temp or environment secrets.
    - Develop and verify migrations locally before pushing to the hosted project.
    - Pass --local or --linked explicitly for database commands when target ambiguity is possible.
  admin_access:
    membership_table: private.admin_users
    client_check: public.is_admin()
    assignment_path: direct database SQL only
    operator_guide: docs/engineering/admin-access.md
  affirmation_content:
    tables:
      - public.affirmation_topics
      - public.affirmation_topic_translations
      - public.affirmations
      - public.affirmation_translations
      - public.affirmation_backgrounds
      - public.affirmation_background_translations
      - public.supported_languages
      - public.app_text_translations
    supporter_access: select_published_only
    admin_access: rls_protected_crud
    admin_authorization: public.is_admin()
    offline_cache: validated_last_known_good_per_language
    editorial_translation_fallback: none
    app_text_fallback: remote_then_bundled_language_then_bundled_english
  user_settings:
    table: public.user_settings
    ownership: auth.uid()
    supporter_access: current_user_row_only
    anonymous_behavior: device_only
    authenticated_behavior: database_backed_with_device_cache
    login_conflict_rule: database_wins
    initial_row_rule: seed_from_device_when_database_row_is_absent
    offline_write_rule: retain_user_scoped_pending_snapshot_and_retry
    language_preference: language_code

open_decisions:
  - id: SUP-TBD-001
    question: Which additional application tables, storage buckets, and Edge Functions are required?
    status: TBD
