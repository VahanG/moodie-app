name: Docs Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate docs linkage in PR body
        run: node scripts/validate-doc-links.js --strict --from-github-event
